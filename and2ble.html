<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AND2BLE • Fan ID</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Courier New",monospace;color:#244f4b;background:linear-gradient(135deg,#d9f8e7,#d9f4ff 55%,#c7ecd6);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:24px 24px}.wrap{width:min(1180px,94%);margin:auto;padding:30px 0 45px;position:relative;z-index:1}.top{display:flex;align-items:center;gap:15px;margin-bottom:24px}.home,.download{text-decoration:none;color:#fff;background:#55ad7c;padding:10px 14px;border:3px solid #fff;outline:2px solid #579b84;box-shadow:4px 4px #28526833;font-weight:bold;font-size:11px;cursor:pointer;font-family:inherit}.title{text-align:center;flex:1}.title small{letter-spacing:3px;opacity:.75}h1{margin:5px 0 0;font-size:clamp(30px,5vw,52px);letter-spacing:3px;text-shadow:3px 3px #fff}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start}.panel{background:#ffffffc7;border:4px solid #fff;outline:3px solid #579b84;box-shadow:9px 9px #2852682e}.bar{height:40px;background:#55ad7c;color:#fff;display:flex;align-items:center;padding:0 11px;font-size:12px;letter-spacing:1px}.dots{display:flex;gap:5px;margin-right:11px}.dots span{width:9px;height:9px;background:#fff;border:1px solid #0002}.members{padding:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:17px}.member{cursor:pointer;text-align:center;background:#e8f8f1;border:3px solid #fff;outline:2px solid #579b84;box-shadow:5px 5px #28526822;padding:10px;transition:.18s;font-family:inherit;color:#244f4b}.member:hover,.member.active{transform:translateY(-4px);background:#fff}.member img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border:2px solid #8bc8ad}.member strong{display:block;margin-top:9px;font-size:12px}.member span{font-size:10px;opacity:.7}.card-panel{padding:22px}.idcard{background:linear-gradient(145deg,#fff,#e8f8f1);border:4px solid #2f7764;box-shadow:8px 8px #8bc8ad;padding:16px;position:relative;overflow:hidden}.idcard:after{content:"AND2BLE";position:absolute;right:-22px;bottom:55px;font-size:40px;font-weight:bold;color:#55ad7c12;transform:rotate(-20deg)}.idtop{display:flex;justify-content:space-between;border-bottom:2px dashed #8bc8ad;padding-bottom:10px;margin-bottom:14px}.idtitle{font-weight:bold;font-size:15px}.idcode{font-size:9px;opacity:.65}.card-layout{display:grid;grid-template-columns:145px 1fr;gap:20px;align-items:start}.photo{width:145px;height:175px;border:4px solid #55ad7c;background:#e8f8f1;padding:5px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;transition:opacity .15s}.fields{display:grid;gap:8px}.field{border-bottom:2px dotted #8bc8ad;padding:7px 0}.field label{display:block;font-size:9px;letter-spacing:1px;opacity:.7;margin-bottom:3px}.field input{width:100%;border:0;outline:0;background:transparent;font:12px "Courier New",monospace;color:#244f4b}.stamp{margin-top:14px;padding:8px;text-align:center;border:2px dashed #55ad7c;color:#2f7764;font-size:10px;letter-spacing:2px}.actions{display:flex;gap:10px;margin-top:12px}.download{flex:1;background:#2f7764}.hint{font-size:9px;line-height:1.5;opacity:.7;text-align:center;margin:10px 0 0}footer{text-align:center;margin-top:25px;font-size:10px;opacity:.7}@media(max-width:850px){.grid{grid-template-columns:1fr}.members{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.members{grid-template-columns:1fr}.card-layout{grid-template-columns:1fr}.photo{margin:auto}.top{flex-wrap:wrap}.title{width:100%;order:-1}}
</style></head><body><main class="wrap"><div class="top"><a class="home" href="index.html">← HOME</a><div class="title"><small>WELCOME, N:DCLO</small><h1>AND2BLE</h1></div></div><div class="grid"><section class="panel"><div class="bar"><div class="dots"><span></span><span></span><span></span></div>MEMBERS.EXE</div><div class="members"><button class="member active" data-name="BO SEUNGEON" data-img="images/seungeon.jpg"><img src="images/seungeon.jpg" alt="BO SEUNGEON"><strong>BO SEUNGEON</strong><span>click me ♡</span></button><button class="member " data-name="KIM GYUVIN" data-img="images/gyuvin.png"><img src="images/gyuvin.png" alt="KIM GYUVIN"><strong>KIM GYUVIN</strong><span>click me ♡</span></button><button class="member " data-name="ZHANG HAO" data-img="images/zhang-hao.jpg"><img src="images/zhang-hao.jpg" alt="ZHANG HAO"><strong>ZHANG HAO</strong><span>click me ♡</span></button><button class="member " data-name="HAN YUJIN" data-img="images/yujin.jpg"><img src="images/yujin.jpg" alt="HAN YUJIN"><strong>HAN YUJIN</strong><span>click me ♡</span></button><button class="member " data-name="SHEN RICKY" data-img="images/ricky.jpg"><img src="images/ricky.jpg" alt="SHEN RICKY"><strong>SHEN RICKY</strong><span>click me ♡</span></button></div></section><section class="panel card-panel"><div class="bar"><div class="dots"><span></span><span></span><span></span></div>MY FAN ID.EXE</div><div class="idcard" id="idCard"><div class="idtop"><div class="idtitle">AND2BLE FAN CARD</div><div class="idcode">#NDC-001</div></div><div class="card-layout"><div class="photo"><img id="selectedPhoto" src="images/seungeon.jpg" alt="selected member"></div><div class="fields"><div class="field"><label>NAME</label><input id="fanName" placeholder="your name"></div><div class="field"><label>COUNTRY</label><input id="country" placeholder="your country"></div><div class="field"><label>AGE</label><input id="age" type="number" min="1" max="99" placeholder="your age"></div><div class="field"><label>N:DCLO SINCE</label><input id="fanDate" type="date"></div><div class="field"><label>FAVORITE SONG</label><input id="song" placeholder="your favorite song"></div></div></div><div class="stamp">♡ OFFICIAL LITTLE FAN ♡</div><div class="actions"><button class="download" id="download">↓ DOWNLOAD MY ID CARD</button></div><p class="hint">Choose a member to change the photo. Fill in your details, then download your finished card.</p></div></section></div><footer>made with ♡ for AND2BLE</footer></main><script>
const members=document.querySelectorAll('.member'),photo=document.getElementById('selectedPhoto');members.forEach(m=>m.addEventListener('click',()=>{members.forEach(x=>x.classList.remove('active'));m.classList.add('active');photo.style.opacity='0';setTimeout(()=>{photo.src=m.dataset.img;photo.style.opacity='1'},120)}));const ids=['fanName','country','age','fanDate','song'],key='and2ble_fan_card';const saved=JSON.parse(localStorage.getItem(key)||'{}');ids.forEach(id=>{const e=document.getElementById(id);if(saved[id])e.value=saved[id];e.addEventListener('input',()=>{const d=JSON.parse(localStorage.getItem(key)||'{}');d[id]=e.value;localStorage.setItem(key,JSON.stringify(d))})});
function downloadCard(){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1200;canvas.height=700;ctx.fillStyle='#e8f8f1';ctx.fillRect(0,0,1200,700);ctx.strokeStyle='#55ad7c';ctx.lineWidth=10;ctx.strokeRect(18,18,1164,664);ctx.fillStyle='#55ad7c';ctx.fillRect(18,18,1164,72);ctx.fillStyle='#fff';ctx.font='bold 28px Courier New';ctx.fillText('AND2BLE FAN CARD',45,63);ctx.fillStyle='#244f4b';ctx.font='bold 20px Courier New';ctx.fillText('MEMBER',480,145);ctx.font='bold 26px Courier New';ctx.fillText(document.querySelector('.member.active').dataset.name,480,180);const labels=['NAME','COUNTRY','AGE','N:DCLO SINCE','FAVORITE SONG'];const vals=ids.map(id=>document.getElementById(id).value||'');labels.forEach((l,i)=>{ctx.fillStyle='#55ad7c';ctx.font='bold 16px Courier New';ctx.fillText(l,480,235+i*68);ctx.fillStyle='#244f4b';ctx.font='20px Courier New';ctx.fillText(vals[i]||'—',480,260+i*68)});const img=new Image();img.onload=()=>{ctx.drawImage(img,55,125,350,440);ctx.fillStyle='#55ad7c';ctx.font='bold 18px Courier New';ctx.fillText('♡ OFFICIAL LITTLE FAN ♡',55,610);const a=document.createElement('a');a.download='and2ble_fan_id.png';a.href=canvas.toDataURL('image/png');a.click()};img.src=photo.src}document.getElementById('download').addEventListener('click',downloadCard);
</script></body></html>
